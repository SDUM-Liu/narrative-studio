<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叙映工坊 · Narrative Studio</title>
<style>
@font-face{font-family:NarrativeCJK;src:url('/font/NotoSansCJKsc-Regular.otf') format('opentype');font-display:swap}body{font-family:NarrativeCJK,system-ui,sans-serif!important}
:root{color-scheme:dark;--bg:#101319;--panel:#181c24;--line:#2c3340;--muted:#9ba8ba;--accent:#a5e0ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf0f6;font:14px/1.6 system-ui,sans-serif}button,select,input,textarea{font:inherit;color:inherit;background:#242b37;border:1px solid #3b4656;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:wait}button.primary{color:#101319;background:var(--accent);border-color:var(--accent)}button.reject{color:#ffb3a5}header{height:78px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}header h1{font-size:21px;font-weight:650;letter-spacing:2px;margin:0}header small{color:var(--muted);font-size:11px;letter-spacing:2px}.logo{width:36px;height:36px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent)}.right{margin-left:auto}.tag{padding:3px 9px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--accent)}.layout{display:grid;grid-template-columns:230px minmax(400px,1fr) 350px;min-height:calc(100vh - 78px)}aside{border-right:1px solid var(--line);padding:25px 18px}aside h3{font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:500}#projectList button{display:block;width:100%;text-align:left;margin:9px 0;background:transparent}#projectList button.active{background:#26372e;border-color:#456650}.muted{color:var(--muted)}.cap{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.cap span{float:right;color:#d4b76d}.workspace{padding:28px;min-width:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{font-size:24px;margin:0 auto 0 0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.metric{border:1px solid var(--line);border-radius:9px;padding:14px}.metric strong{display:block;font-size:25px}.metric span{color:var(--muted);font-size:12px}#shotList{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--panel)}.shot.active{outline:2px solid var(--accent)}.shot .visual{height:200px;background:linear-gradient(145deg,#252d3b,#151922);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px}.shot img{height:100%;width:100%;object-fit:contain}.shot .body{padding:13px}.shot .state{font-size:11px;color:var(--accent)}.shot p{margin:6px 0;color:var(--muted);font-size:12px}.inspector{padding:25px 20px;border-left:1px solid var(--line);background:#151922;min-width:0}.inspector h3{margin:0 0 16px;font-size:16px}.inspector video,.inspector img{max-width:100%;max-height:400px;display:block;margin:12px auto;background:#090b0f}.inspector audio{width:100%;margin:8px 0}.inspector textarea{width:100%;height:65px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#101319;padding:12px;border-radius:6px;max-height:320px;overflow:auto}details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}summary{cursor:pointer;color:var(--muted)}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:80vw;padding:13px 20px;border-radius:8px;background:#31443b;border:1px solid #5d8c73;display:none;z-index:20}.empty{padding:40px 0;color:var(--muted)}.sub{font-size:12px;color:var(--muted)}#jobs{max-height:260px;overflow:auto}#jobs div{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}@media(max-width:1150px){.layout{grid-template-columns:190px 1fr}.inspector{grid-column:2}.summary{gap:7px}.workspace{padding:20px}}@media(max-width:680px){header{padding:0 14px}.layout{display:block}aside{border-bottom:1px solid var(--line)}#projectList{display:flex;gap:10px}#projectList button{width:auto}.inspector{border-top:1px solid var(--line)}.summary{grid-template-columns:repeat(2,1fr)}.toolbar h2{width:100%}}
</style>
<header><div class="logo">叙</div><div><h1>叙映工坊</h1><small>NARRATIVE STUDIO</small></div><span class="tag right" id="health">连接本地生产服务</span><button onclick="refresh()">刷新状态</button></header>
<div class="layout"><aside><h3>作品 / PROJECTS</h3><div id="projectList"></div><h3 style="margin-top:35px">能力实测</h3><div id="caps"></div><p class="sub">通过仅表示已有验收记录。配音叠加与口型同步分别验收。</p><h3 style="margin-top:35px">运行环境</h3><div class="sub" id="deploy"></div><p class="sub">本地模型执行生产任务<br>云端收费API默认关闭<br>SSH 转发访问 · 状态自动保存</p></aside>
<main class="workspace"><div class="toolbar"><h2 id="projectName">制作工作台</h2><select id="episode" onchange="pickEpisode()" aria-label="选择分集"></select><button onclick="exportFilm()">导出预览片</button></div><p class="sub" id="projectMeta"></p><div class="summary" id="summary"></div><div class="toolbar" style="margin-bottom:18px"><b>镜头审核</b><span class="sub">首帧通过后解锁视频生成</span><select class="right" id="filter" onchange="renderShots()"><option value="">全部状态</option><option>待生成</option><option>首帧待审</option><option>首帧通过</option><option>视频待审</option><option>退回重做</option><option>通过</option><option>失败</option></select></div><div id="shotList"></div><details open style="margin-top:30px"><summary>任务队列 · 最近记录</summary><div id="jobs"></div></details></main>
<section class="inspector" id="inspector"><h3>镜头详情</h3><p class="muted">选择镜头，查看候选与审核记录。</p></section></div><div id="notice" role="status"></div>
<script>
let state={projects:[],pid:null,ep:null,shots:[],tasks:[],shot:null,task:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={image:'首帧',edit:'参考图编辑',video:'视频',tts:'配音'},statuses={pending:'排队 / 等待依赖或资源',running:'本地推理中',review:'待审核',approved:'已通过',rejected:'已退回',failed:'失败'};let toastTimer;
function notice(msg){$('notice').textContent=msg;$('notice').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').style.display='none',9000)}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.detail||'请求失败');return d}
function media(path){return '/media/'+encodeURIComponent(state.pid)+'/'+path.split('/').map(encodeURIComponent).join('/')}
async function health(){const d=await api('/api/health');$('health').textContent='● 本地服务在线';$('caps').innerHTML=Object.entries(d.capabilities).map(([k,v])=>`<div class="cap">${esc(k)}<span>${esc(v.status||v)}</span></div>`).join('')||'<span class="sub">正在建立实测记录</span>';$('deploy').innerHTML=Object.entries(d.deployment).map(([k,v])=>`${esc(k)}：${esc(v)}<br>`).join('')}
async function boot(){try{await health();state.projects=await api('/api/projects');$('projectList').innerHTML=state.projects.map(p=>`<button data-project="${esc(p.id)}">${esc(p.name)}<div class="sub">${esc(p.id)}</div></button>`).join('');$('projectList').querySelectorAll('button').forEach(b=>b.onclick=()=>pickProject(b.dataset.project));if(state.projects.length)await pickProject(state.projects[0].id)}catch(e){notice(e.message)}}
async function pickProject(pid){state.pid=pid;state.shot=null;state.task=null;state.shots=[];state.tasks=[];state.stats={};$('shotList').innerHTML='<p class="muted">正在读取作品…</p>';$('inspector').innerHTML='<h3>镜头详情</h3><p class="muted">选择镜头后查看此作品候选。</p>';renderJobs();const p=state.projects.find(p=>p.id===pid);$('projectName').textContent=p.name;$('projectMeta').textContent=[p.genre,p.language,p.format.aspect_ratio,`${p.format.width} × ${p.format.height}`,`${p.format.fps} fps`].join(' · ');document.querySelectorAll('[data-project]').forEach(b=>b.classList.toggle('active',b.dataset.project===pid));const all=await api(`/api/projects/${pid}/shots`);if(state.pid!==pid)return;const eps=[...new Set(all.map(s=>s.episode))];$('episode').innerHTML=eps.map(e=>`<option value="${esc(e)}">分集 ${esc(e)}</option>`).join('');state.ep=eps[0]||null;await refresh()}
async function pickEpisode(){state.ep=$('episode').value;state.shot=null;state.task=null;state.shots=[];state.tasks=[];state.stats={};renderShots();renderJobs();await refresh()}
let refreshSequence=0;
async function refresh(){try{const seq=++refreshSequence,pid=state.pid,ep=state.ep;await health();if(!pid)return;const suffix=ep?'?episode='+encodeURIComponent(ep):'';const data=await Promise.all([api(`/api/projects/${pid}/shots${suffix}`),api(`/api/projects/${pid}/tasks${suffix}`),api(`/api/projects/${pid}/stats${suffix}`)]);if(seq!==refreshSequence||pid!==state.pid||ep!==state.ep)return;const saved={task:state.task,reason:$('reason')?.value,videoTime:document.querySelector('#inspector video')?.currentTime,videoPaused:document.querySelector('#inspector video')?.paused};[state.shots,state.tasks,state.stats]=data;renderShots();renderJobs();await renderDetail();if(saved.task===state.task){if($('reason')&&saved.reason)$('reason').value=saved.reason;const video=document.querySelector('#inspector video');if(video&&saved.videoTime!==undefined){video.currentTime=saved.videoTime;if(!saved.videoPaused)video.play().catch(()=>{})}}}catch(e){notice(e.message)}}
function renderShots(){const n=state.shots.length;const pending=state.stats?.review||0;const running=(state.stats?.pending||0)+(state.stats?.running||0);const passed=state.shots.filter(s=>s.status==='通过').length;$('summary').innerHTML=[[n,'镜头总数'],[pending,'等待审核'],[running,'执行 / 排队'],[passed,'视频已通过']].map(([v,k])=>`<div class="metric"><strong>${v}</strong><span>${k}</span></div>`).join('');const shots=state.shots.filter(s=>!$('filter').value||s.status===$('filter').value);$('shotList').innerHTML=shots.map(s=>{const t=state.tasks.find(t=>t.id===s.selected_image)||state.tasks.find(t=>t.shot===s.id&&['image','edit'].includes(t.kind)&&t.output);const preview=s.selected_image_output||s.preview_image_output||t?.output;return `<article class="shot ${state.shot===s.id?'active':''}" data-shot="${esc(s.id)}"><div class="visual">${preview?`<img loading="lazy" src="${media(preview)}" alt="镜头 ${esc(s.id)} 首帧">`:'等待本地生成首帧'}</div><div class="body"><span class="state">${esc(s.status)}</span><div><b>${esc(s.id)}</b> · ${esc(s.spec.scene)}</div><p>${esc(s.spec.target_duration)} 秒 · ${esc(s.spec.characters.join(' / '))}</p></div></article>`}).join('')||'<div class="empty">此分集暂无符合条件的镜头。</div>';$('shotList').querySelectorAll('[data-shot]').forEach(el=>el.onclick=()=>{state.shot=el.dataset.shot;state.task=null;renderShots();renderDetail()})}
function renderJobs(){$('jobs').innerHTML=state.tasks.map(t=>`<div><span class="tag">${esc(names[t.kind])}</span> ${esc(t.shot)} · ${esc(statuses[t.status])} ${t.gpu!==null?`· GPU ${t.gpu}`:''}<span class="sub"> · ${esc(t.id.slice(0,8))}${t.reason?' · '+esc(t.reason):''}</span></div>`).join('')||'<p class="sub">队列为空</p>'}
async function renderDetail(){const s=state.shots.find(s=>s.id===state.shot);if(!s){$('inspector').innerHTML='<h3>镜头详情</h3><p class="muted">选择镜头，查看候选与审核记录。</p>';return}const selectedPid=state.pid;const tasks=await api(`/api/projects/${selectedPid}/tasks?episode=${encodeURIComponent(s.episode)}&shot=${encodeURIComponent(s.id)}`);if(state.pid!==selectedPid||state.shot!==s.id)return;let t=tasks.find(t=>t.id===state.task)||tasks.find(t=>t.status==='review')||tasks[0];state.task=t?.id;let visual='';if(t?.output){const path=media(t.output);visual=t.kind==='video'?`<video controls preload="metadata" src="${path}"></video>`:t.kind==='tts'?`<audio controls src="${path}"></audio>`:`<img src="${path}" alt="候选首帧">`}const voice=tasks.find(t=>t.id===s.selected_tts)||tasks.find(t=>t.kind==='tts'&&t.output);const vid=tasks.find(t=>t.id===s.selected_video);$('inspector').innerHTML=`<h3>${esc(s.id)} <span class="tag">${esc(s.status)}</span></h3><div class="sub">${esc(s.spec.scene)} · ${esc(s.spec.target_duration)} 秒</div>${s.export_trim?`<p class="sub">导出范围 ${esc(s.export_trim.in||0)}–${esc(s.export_trim.out)} 秒 · ${esc(s.export_trim.reason)}</p>`:''}<label class="sub">选择候选版本<select id="candidate" style="width:100%;margin-top:8px">${tasks.map(j=>`<option value="${j.id}" ${j.id===t?.id?'selected':''}>${esc(names[j.kind])} · ${esc(statuses[j.status])} · ${j.id.slice(0,8)}</option>`).join('')}</select></label>${visual}${voice&&t?.kind!=='tts'?`<audio controls src="${media(voice.output)}"></audio>`:''}<p>${esc(s.spec.dialogue)||'<span class="muted">无对白</span>'}</p><p class="sub">${esc(s.spec.speaker)} · 口型同步尚需独立验收</p><textarea id="reason" placeholder="审核意见；退回时必须填写" aria-label="审核意见"></textarea><div class="actions"><button class="primary" id="approve" ${t&&['review','approved'].includes(t.status)?'':'disabled'}>通过当前候选</button><button class="reject" id="reject" ${t&&['review','approved'].includes(t.status)?'':'disabled'}>退回</button><button id="redo" ${t&&!['running','pending'].includes(t.status)?'':'disabled'}>重做新版本</button></div><details open><summary>提交制作任务</summary><div class="actions" style="margin-top:12px">${Object.entries(names).map(([k,n])=>`<button data-kind="${k}">${n}</button>`).join('')}</div></details><details><summary>剧本与提示词 · 保留原文</summary><pre>${esc(JSON.stringify(s.spec,null,2))}</pre></details><details><summary>当前候选参数与耗时</summary><pre>${esc(JSON.stringify(t?{id:t.id,gpu:t.gpu,params:t.params,metrics:t.metrics,reason:t.reason}: {},null,2))}</pre></details><details><summary>审核与运行日志</summary><pre id="events">按需读取最近40条</pre></details>${vid?`<p><a href="${media(vid.output)}" download>下载已通过视频素材</a></p>`:''}`;$('candidate').onchange=e=>{state.task=e.target.value;renderDetail()};for(const [id,d] of [['approve','approve'],['reject','reject']])$(id).onclick=async()=>{try{await api(`/api/tasks/${t.id}/review`,{decision:d,reason:$('reason').value});notice(d==='approve'?'审核已保存；后续任务按依赖继续':'已退回并保存原因');await refresh()}catch(e){notice(e.message)}};$('redo').onclick=async()=>{try{await api(`/api/tasks/${t.id}/retry`,{params:{}});notice('已提交新版本，已有素材保留');await refresh()}catch(e){notice(e.message)}};document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=async()=>{try{await api(`/api/projects/${state.pid}/submit`,{episode:s.episode,shot:s.id,kind:b.dataset.kind});notice('已进入队列');await refresh()}catch(e){notice(e.message)}});if(t){try{const rows=await api(`/api/projects/${state.pid}/events?task=${t.id}`);if(state.task===t.id&&$('events'))$('events').textContent=rows.map(r=>`${new Date(r.time*1000).toLocaleString('zh-CN')} ${r.event} ${r.detail}`).join('\n')}catch(e){notice(e.message)}}}
async function exportFilm(){if(!state.ep)return;notice('正在检查已通过素材并合成；缺失或过短的动作视频会阻止导出。');try{const d=await api(`/api/projects/${state.pid}/export`,{episode:state.ep});notice('导出完成：'+d.path)}catch(e){notice(e.message)}}
boot();setInterval(()=>{if(!document.hidden)refresh()},30000);
</script></html>
